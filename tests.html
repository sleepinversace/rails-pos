<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rails POS tests</title>
<style>
  :root { color-scheme: light dark; --ok: #157a3c; --bad: #b42318; }
  body { font: 15px/1.45 system-ui, sans-serif; margin: 16px; background: Canvas; color: CanvasText; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #summary { font-weight: 700; margin-left: 10px; }
  #results { padding-left: 22px; }
  #results li { margin: 4px 0; }
  .pass { color: var(--ok); } .fail { color: var(--bad); } .fail pre { white-space: pre-wrap; margin: 2px 0 6px; font-size: 12px; }
  .frames { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  iframe { border: 1px solid #8884; border-radius: 8px; background: #fff; }
  button { font: inherit; padding: 8px 16px; }
</style>
</head>
<body>
<h1>Rails POS — automated tests</h1>
<p>These drive the real app (clicks, typing, reloads) inside the frame below. They use a <strong>separate test database</strong>, so your shop's data is not touched. Open this page through a local server, e.g. <code>http://localhost:8000/tests.html</code>.</p>
<button id="run">Run all tests</button><span id="summary"></span>
<ol id="results"></ol>
<div class="frames">
  <iframe id="app" title="App under test" width="390" height="844"></iframe>
  <iframe id="app2" title="Second tab" width="390" height="400"></iframe>
</div>

<script>
'use strict';
/* ---------- tiny test harness ---------- */
const TEST_DB = 'rails-pos-test';
const tests = [];
const test = (name, fn) => tests.push({ name, fn });
const sleep = ms => new Promise(r => setTimeout(r, ms));
let frame, w, d, P;

function use(f) { frame = f; w = f.contentWindow; d = f.contentDocument; P = w.__pos; }
async function waitFor(fn, ms = 4000, what = 'condition') {
  const end = Date.now() + ms;
  while (Date.now() < end) { try { if (fn()) return; } catch {} await sleep(30); }
  throw new Error('Timed out waiting for ' + what);
}
async function loadApp(f = document.getElementById('app')) {
  f.src = 'index.html?test=1&t=' + Date.now();
  await new Promise(r => { f.onload = r; });
  await waitFor(() => f.contentWindow.__pos && (f.contentWindow.__pos.ui.appActive || !f.contentDocument.getElementById('blocker').hidden), 5000, 'app to start');
  use(f);
}
async function blank(f) { f.src = 'about:blank'; await new Promise(r => { f.onload = r; }); }
function deleteDb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.deleteDatabase(TEST_DB);
    r.onsuccess = resolve; r.onerror = () => reject(r.error); r.onblocked = () => setTimeout(resolve, 300);
  });
}
const $ = sel => d.querySelector(sel);
function click(sel) { const el = $(sel); if (!el) throw new Error('Not found: ' + sel); el.click(); }
function type(sel, v) {
  const el = $(sel); if (!el) throw new Error('Not found: ' + sel);
  el.value = v;
  el.dispatchEvent(new w.Event('input', { bubbles: true }));
  el.dispatchEvent(new w.Event('change', { bubbles: true }));
}
const tick = (ms = 80) => sleep(ms);
function eq(actual, expected, label) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
}
function ok(cond, label) { if (!cond) throw new Error(label); }
async function confirmYes() { await waitFor(() => $('[data-action="confirm-ok"]'), 2000, 'confirm dialog'); click('[data-action="confirm-ok"]'); await tick(400); }
function closeModal() { const b = $('#modal [data-action="close-modal"]'); if (b) b.click(); }
async function nav(view) { closeModal(); click(`[data-action="nav"][data-view="${view}"]`); await tick(); }
const product = name => P.state.products.find(p => p.name === name);
const variant = (p, size, colour) => p.variants.find(v => v.size === size && v.colour === colour);
const lastSale = () => P.state.sales[P.state.sales.length - 1];
const movements = async () => (await P.DB.getAll('movements')).sort((a, b) => a.date.localeCompare(b.date));

/** Pick a product + size/colour in the picker and add qty to the cart. */
async function addItem(p, size, colour, qty = 1) {
  await nav('sell');
  click(`[data-action="pick"][data-id="${p.id}"]`); await tick();
  if (p.variants.length === 1) return;
  const sz = $(`[data-action="pk-size"][data-v="${size}"]`); if (!sz.classList.contains('on')) sz.click(); await tick(30);
  const co = $(`[data-action="pk-colour"][data-v="${colour}"]`); if (!co.classList.contains('on')) co.click(); await tick(30);
  for (let i = 1; i < qty; i++) { click('[data-action="pk-qty"][data-d="1"]'); await tick(20); }
  click('[data-action="pk-add"]'); await tick();
}
/** Open the cart and pay. */
async function pay(method = 'cash', tendered = '') {
  click('[data-action="open-cart"]'); await tick();
  click(`[data-action="pay"][data-pay="${method}"]`); await tick(30);
  if (method === 'cash' && !$('#cashRow').hidden) type('#tendered', tendered);
  await tick(30);
  click('#chargeBtn'); await tick(450);
}
const receiptText = () => $('#modal .receipt')?.textContent || '';

/* ---------- colour contrast (WCAG) ---------- */
function lum(hex) {
  const c = hex.trim().replace('#', '');
  const rgb = [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
}
const contrast = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };

/* =================== TESTS =================== */

const OWNER = { user: 'Amish', pin: '2033' }; // the default owner account
async function signIn(user, pin) {
  $('#siUser').value = user; $('#siPin').value = pin;
  $('#siGo').click();
  await waitFor(() => !$('#siGo').disabled && ($('#signin').hidden || $('#siError').textContent), 4000, 'sign-in result');
}

/** First-time setup on a new device: create the owner (and shop / demo). */
async function setupShop(mode, shop, name, pin) {
  click(`[data-action="setup-go"][data-step="${mode}"]`); await tick();
  if (shop != null) type('#suShop', shop);
  type('#suName', name); type('#suPin', pin); type('#suPin2', pin);
  $('#setupForm').requestSubmit();
  await tick(400);
}

test('First-time setup: no built-in login; the owner creates their own; demo data on request', async () => {
  ok(!$('#setup').hidden, 'setup screen on a new device');
  ok($('#signin').hidden && $('.app-nav').inert, 'till locked behind it');
  eq(await P.DB.get('kv', 'auth'), undefined, 'no accounts exist yet');
  eq(await P.checkLogin('amish', OWNER.pin), null, 'no built-in Amish account');
  await setupShop('demo', 'Demo Boutique', 'Amish', '12');
  ok($('#setupErr').textContent.includes('4-digit'), 'short PIN refused');
  type('#suPin', OWNER.pin); type('#suPin2', '9999'); $('#setupForm').requestSubmit(); await tick(300);
  ok($('#setupErr').textContent.includes('not the same'), 'mismatched PINs refused');
  type('#suPin2', OWNER.pin); $('#setupForm').requestSubmit();
  await waitFor(() => $('#setup').hidden && P.ui.user, 4000, 'setup to finish');
  eq([$('#userLabel').textContent, P.state.settings.storeName, P.ui.user.role], ['Amish', 'Demo Boutique', 'owner'], 'signed in as the new owner');
  click('#lockBtn'); await tick(100);
});

test('Sign-in: covers the till; username is not case-sensitive; wrong PIN is refused', async () => {
  ok(!$('#signin').hidden, 'sign-in screen shown');
  ok($('.app-nav').inert, 'till is locked behind it');
  await signIn('amish', '1234');
  ok(!$('#signin').hidden && $('#siError').textContent.includes('Wrong'), 'wrong PIN refused');
  await signIn('nobody', OWNER.pin);
  ok(!$('#signin').hidden, 'unknown user refused');
  await signIn('  aMiSh ', '12');
  ok($('#siError').textContent.includes('4 digits'), 'short PIN rejected');
  await signIn('  aMiSh ', OWNER.pin);
  ok($('#signin').hidden, 'signed in with mixed-case username');
  eq($('#userLabel').textContent, 'Amish', 'name in header');
  ok(!$('.app-nav').inert, 'till usable');
  const auth = await P.DB.get('kv', 'auth');
  ok(!JSON.stringify(auth).includes(OWNER.pin), 'PIN is not stored in plain text');
});

test('First run loads 8 demo products and sample sales', async () => {
  eq(P.state.products.length, 8, 'products');
  ok(P.state.sales.length > 0, 'has demo sales');
  eq(P.state.meta.demo, true, 'demo flag');
  ok($('#banners').textContent.includes('Demo data'), 'demo banner shown');
});

test('Start fresh empties the shop', async () => {
  click('#banners [data-action="start-fresh"]'); await confirmYes();
  eq([P.state.products.length, P.state.sales.length, P.state.meta.nextReceiptNo, P.state.meta.demo], [0, 0, 1, false], 'counts');
});

  type('#fSizes', 'S, M'); type('#fColours', 'Red, Blue'); await tick(30);
  type('#fAll', '5'); click('[data-action="np-all"]');
  click('[data-action="np-save"]'); await tick(300);
  const p = product('Test <b>Tee</b>');
  ok(p, 'product exists');
  eq(p.variants.map(v => `${v.sku}:${v.stock}`), ['TB-RED-S:5', 'TB-RED-M:5', 'TB-BLU-S:5', 'TB-BLU-M:5'], 'variants');
  eq($('#stockList h3').innerHTML, 'Test &lt;b&gt;Tee&lt;/b&gt;', 'escaped heading');
  eq((await movements()).filter(m => m.reason === 'new').length, 4, 'opening stock movements');
});

test('Variant with its own price (XL costs more)', async () => {
  const p = product('Test <b>Tee</b>');
  click(`[data-action="add-variant"][data-id="${p.id}"]`); await tick();
  type('#vSize', 'XL'); type('#vColour', 'Red'); type('#vStock', '2'); type('#vPrice', '260');
  click('[data-action="variant-save"]'); await tick(300);
  const xl = variant(p, 'XL', 'Red');
  eq([xl.price, xl.stock], [26000, 2], 'XL price & stock');
  await nav('sell');
  ok($(`[data-action="pick"][data-id="${p.id}"]`).textContent.includes('from R230.00'), 'card shows "from" price');
});

test('Cash sale: totals, VAT, change, stock down, movement, tax invoice', async () => {
  const p = product('Test <b>Tee</b>');
  await addItem(p, 'M', 'Red', 2);
  await pay('cash', '500');
  const s = lastSale();
  eq([s.number, s.total, s.vat, s.change, s.paid], [1, 46000, 6000, 4000, 46000], 'sale numbers');
  eq(variant(p, 'M', 'Red').stock, 3, 'stock after sale');
  const m = (await movements()).filter(x => x.reason === 'sale');
  eq(m.map(x => [x.change, x.after, x.ref]), [[-2, 3, '#00001']], 'sale movement');
  ok(receiptText().includes('TAX INVOICE'), 'tax invoice header');
  ok($('#modal .receipt').innerHTML.includes('&lt;b&gt;'), 'receipt escapes HTML');
  // 80 mm layout: Qty / Description / Price / Total columns, 42 characters, big total
  const lines = receiptText().split('\n');
  ok(lines.some(l => /^Qty Description\s+Price\s+Total$/.test(l)) && lines.some((l, i) => /^2x Test <b>Tee<\/b>\s+R230\.00\s+R460\.00$/.test(l) && lines[i + 1].trim() === '(M/Red)'), 'item columns (long names wrap under the description)');
  ok(lines.every(l => l.length <= 42), 'fits 80 mm (42 characters)');
  ok($('#modal .receipt .big')?.textContent.startsWith('TOTAL (ZAR)') || [...d.querySelectorAll('#modal .receipt .big')].some(b => b.textContent.startsWith('TOTAL (ZAR)')), 'total printed large');
  ok(receiptText().includes('Employee:') || !lastSale().cashier, 'employee line');
  // WhatsApp / email copy: plain text, 32 characters wide, no layout marks
  const plain = w.resolveDoc(`sale:${s.id}`).text;
  ok(plain.split('\n').every(l => l.length <= 32) && !plain.includes('\u0002') && plain.includes('TOTAL (ZAR)'), 'WhatsApp text 32 wide');
  closeModal();
});

});

/** Repeatable "random" numbers (mulberry32): the same noise on every run, so the barcode test never passes or fails by chance. */
function seededRandom(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
/** Draw bar/space widths like a printed label; optional fractional module size, blur, noise, upside down. */
function drawBarcode(widths, { module = 3, blur = 0, noise = 0, upsideDown = false } = {}) {
  const ws = upsideDown ? widths.slice().reverse() : widths;
  const quiet = 14 * module;
  const W = Math.ceil(ws.reduce((a, b) => a + b, 0) * module + quiet * 2), H = 110;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = 'rgb(232,232,226)'; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgb(28,28,34)';
  let x = quiet;
  ws.forEach((wd, i) => { if (i % 2 === 0) g.fillRect(x, 8, wd * module, H - 16); x += wd * module; });
  let out = c;
  if (blur) { out = document.createElement('canvas'); out.width = W; out.height = H; const g2 = out.getContext('2d'); g2.filter = `blur(${blur}px)`; g2.drawImage(c, 0, 0); }
  const img = out.getContext('2d').getImageData(0, 0, W, H);
  if (noise) { const rand = seededRandom(widths.length * 7919 + noise); for (let i = 0; i < img.data.length; i += 4) { const n = (rand() - 0.5) * noise; for (let k = 0; k < 3; k++) img.data[i + k] = Math.max(0, Math.min(255, img.data[i + k] + n)); } }
  return img;
}

/** Render an inline SVG to pixels (to check a printed barcode really scans). */
async function svgToImageData(svg, W, H) {
  const s = svg.cloneNode(true);
  s.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); s.setAttribute('width', W); s.setAttribute('height', H);
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(s)); });
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H);
  return g.getImageData(0, 0, W, H);
}

/** A tiny .xlsx (zip) built in the test: one entry stored, the others deflated. */
async function makeXlsx(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const [name, text] of Object.entries(files)) {
    const raw = enc.encode(text);
    const deflate = name.includes('sheet');
    const data = deflate ? new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()) : raw;
    const nm = enc.encode(name);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true); head.setUint16(8, deflate ? 8 : 0, true);
    head.setUint32(18, data.length, true); head.setUint32(22, raw.length, true); head.setUint16(26, nm.length, true);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(10, deflate ? 8 : 0, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, raw.length, true); cd.setUint16(28, nm.length, true); cd.setUint32(42, offset, true);
    parts.push(head.buffer, nm, data); central.push(cd.buffer, nm);
    offset += 30 + nm.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer]).arrayBuffer();
}

test('Email me my data: one zip with Excel files and a full backup; the stock list imports back', async () => {
  eq(w.crc32(new TextEncoder().encode('123456789')), 0xCBF43926, 'CRC-32 check value');
  const exp = await w.buildDataExport();
  ok(/^rails-pos-data-[a-z0-9-]+-\d{4}-\d\d-\d\d\.zip$/.test(exp.name), 'file name ' + exp.name);
  const got = await w.unzip(await exp.blob.arrayBuffer(), () => true);
  eq(Object.keys(got).sort(), ['READ ME.txt', 'backup.json', 'cashups.csv', 'clients.csv', 'layby-payments.csv', 'laybys.csv', 'sales.csv', 'stock.csv'], 'files in the zip');
  eq(JSON.parse(got['backup.json']).products.length, P.state.products.length, 'full backup inside');
  const back = w.rowsToItems(w.parseDelimited(got['stock.csv']));
  eq(back.items.length, P.state.products.reduce((a, p) => a + p.variants.length, 0), 'stock.csv reads back with Stock → Import');
  ok(got['clients.csv'].split('\r\n').length === P.state.customers.length + 1, 'one line per client');
  // The button uses the share sheet (Mail, Gmail, Outlook…) where there is one

  ok(shared && shared.files[0].name.endsWith('.zip') && shared.files[0].size > 1000, 'zip handed to the share sheet');
  // iPhone / iPad: Safari refuses the share sheet after the wait → a "Share" button gives a fresh tap
  let calls = 0; shared = null;

  ok($('#modal [data-action="share-pending"]') && !shared, 'Safari refused: "Your file is ready" with a Share button');

  ok($('#settingsBody a[href="legal.html"]'), 'Settings links to the terms page');

  ok(['R380 per month', 'R50 per month', 'R1 500', 'POPIA', 'Information Regulator', 'operator'].every(x => legal.includes(x)), 'terms page has prices, POPIA and operator terms');
});

/* ---------- a fake Supabase (auth + REST) for the sync tests ---------- */
function fakeCloud() {
  const db = { users: {}, shops: [], records: new Map(), seq: 0, offline: false, admins: new Set(), factors: {}, audit: [] };
  const json = (data, status = 200) => new Response(data == null ? '' : JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  const session = email => ({ access_token: 'tok-' + email, refresh_token: 'ref-' + email, expires_in: 3600, user: { id: 'user-' + email, email } });
  db.fetch = async (url, opts = {}) => {
    if (db.offline) throw new TypeError('Failed to fetch');
    const u = new URL(url), p = u.pathname, m = opts.method || 'GET';
    const body = opts.body ? JSON.parse(opts.body) : null;
    const token = String(opts.headers?.Authorization || '').replace('Bearer ', '');
    const aal2 = token.startsWith('tok2-');
    const userId = token.startsWith('tok-') ? 'user-' + token.slice(4) : aal2 ? 'user-' + token.slice(5) : null;
    const param = k => (u.searchParams.get(k) || '').replace(/^(eq|gt)\./, '');
    if (p === '/auth/v1/signup') {
      if (db.users[body.email]) return json({ msg: 'User already registered' }, 422);
      db.users[body.email] = body.password; return json(session(body.email));
    }
    if (p === '/auth/v1/token') {
      if (u.searchParams.get('grant_type') === 'password') return db.users[body.email] === body.password ? json(session(body.email)) : json({ error_description: 'Invalid login credentials' }, 400);
      return json(session(body.refresh_token.slice(4)));
    }
    if (p === '/auth/v1/logout') return json(null, 204);
    if (!userId) return json({ message: 'JWT required' }, 401);
    // Two-step verification (TOTP): code 123456 is "right"
    const email = userId.slice(5);
    if (p === '/auth/v1/user') return json({ id: userId, email, factors: Object.values(db.factors).filter(f => f.user === userId) });
    if (p === '/auth/v1/factors' && m === 'POST') {
      const id = 'f-' + Object.keys(db.factors).length;
      db.factors[id] = { id, user: userId, factor_type: 'totp', status: 'unverified' };
      return json({ id, type: 'totp', totp: { qr_code: 'data:image/svg+xml;utf-8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"/>', secret: 'TESTSECRET' } });
    }
    let fm = p.match(/^\/auth\/v1\/factors\/([^/]+)(\/challenge|\/verify)?$/);
    if (fm) {
      const f = db.factors[decodeURIComponent(fm[1])];
      if (!f || f.user !== userId) return json({ msg: 'Factor not found' }, 404);
      if (m === 'DELETE') { delete db.factors[f.id]; return json(null, 204); }
      if (fm[2] === '/challenge') return json({ id: 'ch-' + f.id });
      if (fm[2] === '/verify') {
        if (body.code !== '123456') return json({ msg: 'Invalid TOTP code entered' }, 422);
        f.status = 'verified';
        return json({ access_token: 'tok2-' + email, refresh_token: 'ref2-' + email, expires_in: 3600, user: { id: userId, email } });
      }
    }
    // Supplier admin functions (the real checks live in supabase-setup.sql)
    if (p.startsWith('/rest/v1/rpc/vendor_')) {
      const fn = p.slice('/rest/v1/rpc/'.length);
      if (fn === 'vendor_whoami') return json({ admin: db.admins.has(userId), aal: aal2 ? 'aal2' : 'aal1' });
      if (!db.admins.has(userId)) return json({ message: 'Not authorised' }, 400);
      const owner = s => Object.keys(db.users).find(e => 'user-' + e === s.owner);
      db.payments ||= [];
      const pays = id => db.payments.filter(p => p.shop_id === id);
      if (fn === 'vendor_list_shops') return json(db.shops.map(s => ({ shop_id: s.id, shop_name: s.name, email: owner(s), plan: s.plan || 'trial', active_until: s.active_until,
        created_at: new Date().toISOString(), last_seen: null, tills: s.next_device - 1, records: 0, deactivated: !!s.deactivated, deactivated_reason: s.deactivated_reason || null,
        paid_total: pays(s.id).reduce((a, p) => a + p.amount_cents, 0), paid_this_month: 0, last_payment: pays(s.id).map(p => p.paid_on).sort().pop() || null,
        devices_30d: s.devices_30d ?? 1, billed_devices: s.billed_devices ?? null, online_now: s.online_now ?? 0 })));
      if (fn === 'vendor_audit_log') return json(db.audit.slice().reverse());
      if (fn === 'vendor_shop_payments') return json(pays(body.p_shop).slice().reverse());
      const shop = db.shops.find(s => s.id === body.p_shop);
      if (!shop) return json({ message: 'Shop not found' }, 400);
      const old = shop.active_until;
      if (fn === 'vendor_set_devices') {
        shop.billed_devices = body.p_devices;
        db.audit.push({ at: new Date().toISOString(), shop_name: shop.name, action: 'Devices billed: ' + (body.p_devices ?? 'automatic'), old_until: old, new_until: old });
        return json(body.p_devices);
      }
      if (fn === 'vendor_set_active') {
        shop.deactivated = !body.p_active; shop.deactivated_reason = body.p_active ? null : (body.p_reason || null);
        db.audit.push({ at: new Date().toISOString(), shop_name: shop.name, action: body.p_active ? 'Reactivated' : 'Deactivated', old_until: old, new_until: old });
        return json(body.p_active);
      }
      if (fn === 'vendor_record_payment_until') {
        if (body.p_paid_on > new Date().toISOString().slice(0, 10)) return json({ message: 'The payment date can\'t be in the future' }, 400);
        if (body.p_until < body.p_paid_on) return json({ message: 'Paid until must be on or after the payment date' }, 400);
        shop.active_until = body.p_until; shop.plan = 'paid';
        db.payments.push({ id: db.payments.length + 1, shop_id: shop.id, paid_on: body.p_paid_on, paid_until: body.p_until, amount_cents: body.p_amount_cents, months: null, method: body.p_method, note: body.p_note });
        db.audit.push({ at: new Date().toISOString(), shop_name: shop.name, action: `Payment on ${body.p_paid_on}`, old_until: old, new_until: shop.active_until });
        return json(shop.active_until);
      }
      if (fn === 'vendor_record_payment') {
        const base = new Date(Math.max(new Date(body.p_paid_on + 'T12:00:00').getTime(), old ? new Date(old + 'T12:00:00').getTime() : 0));
        base.setMonth(base.getMonth() + body.p_months);
        shop.active_until = base.toISOString().slice(0, 10); shop.plan = 'paid';
        db.payments.push({ shop_id: shop.id, paid_on: body.p_paid_on, amount_cents: body.p_amount_cents, months: body.p_months, method: body.p_method, note: body.p_note });
        db.audit.push({ at: new Date().toISOString(), shop_name: shop.name, action: `Payment on ${body.p_paid_on}`, old_until: old, new_until: shop.active_until });
        return json(shop.active_until);
      }
      if (fn === 'vendor_add_months') {
        const base = new Date(Math.max(Date.now(), old ? new Date(old + 'T12:00:00').getTime() : 0));
        base.setMonth(base.getMonth() + body.p_months);
        shop.active_until = base.toISOString().slice(0, 10);
      } else if (fn === 'vendor_set_until') shop.active_until = body.p_until;
      shop.plan = 'paid';
      db.audit.push({ at: new Date().toISOString(), shop_name: shop.name, action: fn === 'vendor_add_months' ? `+${body.p_months} month` : body.p_action, old_until: old, new_until: shop.active_until });
      return json(shop.active_until);
    }
    const mine = db.shops.filter(s => s.owner === userId); // row-level security
    if (p === '/rest/v1/shops') {
      if (m === 'POST') {
        const trial = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10); // like the database default
        const s = { id: 'shop-' + (db.shops.length + 1), owner: userId, name: body.name, generation: 1, next_device: 1, active_until: trial };
        db.shops.push(s); return json([s], 201);
      }
      return json(mine.filter(s => !param('id') || s.id === param('id')));
    }
    const shop = mine.find(s => s.id === (body?.p_shop || param('shop_id') || body?.[0]?.shop_id));
    if (p === '/rest/v1/rpc/claim_device') { shop.next_device++; return json(shop.next_device - 1); }
    if (p === '/rest/v1/rpc/device_ping') {
      if (!shop) return json({ message: 'Not your shop' }, 400);
      db.devices ||= new Map();
      db.devices.set(shop.id + '|' + body.p_device, { shop_id: shop.id, device: body.p_device, code: body.p_code, label: body.p_label, user_name: body.p_user, last_seen: new Date().toISOString() });
      return json([...db.devices.values()].filter(d => d.shop_id === shop.id).map(({ shop_id, ...d }) => d));
    }
    if (p === '/rest/v1/rpc/reset_shop') {
      shop.generation++;
      for (const k of [...db.records.keys()]) if (k.startsWith(shop.id + '|')) db.records.delete(k);
      return json(shop.generation);
    }
    if (p === '/rest/v1/records') {
      if (m === 'POST') {
        for (const r of body) {
          if (!mine.some(s => s.id === r.shop_id)) return json({ message: 'row-level security' }, 403);
          db.records.set(`${r.shop_id}|${r.kind}|${r.id}`, { ...JSON.parse(JSON.stringify(r)), seq: ++db.seq });
        }
        return json(null, 201);
      }
      const after = Number(param('seq')), limit = Number(u.searchParams.get('limit') || 1000);
      return json([...db.records.values()].filter(r => r.shop_id === shop?.id && r.seq > after).sort((a, b) => a.seq - b.seq).slice(0, limit)
        .map(({ kind, id, data, deleted, seq }) => ({ kind, id, data, deleted, seq })));
    }
    return json({ message: 'Not found ' + p }, 404);
  };
  return db;
}
function deleteDbNamed(name) {
  return new Promise(resolve => { const r = indexedDB.deleteDatabase(name); r.onsuccess = resolve; r.onerror = resolve; r.onblocked = () => setTimeout(resolve, 300); });
}

test('Cloud sync: two tills share sales, stock and settings; a wiped device gets everything back', async () => {
  const cloud = fakeCloud();
  const A = document.getElementById('app');
  use(A);
  // Till A creates the shop and uploads its data
  await cloudLogin(cloud, 'cloud-signup');
  await waitFor(() => $('[data-action="cloud-create"]'), 4000, 'create-shop dialog');
  click('[data-action="cloud-create"][data-mode="upload"]');
  await waitFor(() => P.Cloud.status === 'ok' && P.Cloud.pending === 0 && P.Cloud.conf?.lastSyncAt, 6000, 'first upload');
  eq(P.Cloud.conf.deviceCode, 'A', 'first device is till A');
  const nSales = P.state.sales.length;
  const recs = [...cloud.records.values()];
  eq(recs.filter(r => r.kind === 'sales').length, nSales, 'every sale uploaded');
  const v0 = variant(product('Test <b>Tee</b>'), 'S', 'Red');
  eq(recs.filter(r => r.kind === 'movements' && r.data.variantId === v0.id).reduce((a, r) => a + r.data.change, 0), v0.stock, 'cloud movements add up to the stock');
  const stock0 = v0.stock;
  ok($('#netStatus').textContent.startsWith('Synced'), 'header says Synced');

  // Subscription follows the shop's paid-until date in the cloud
  eq(P.licence().state, 'active', 'new shop: 30-day trial counts as active');
  const day = n => { const x = new Date(); x.setDate(x.getDate() + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
  const shop = cloud.shops[0];
  shop.active_until = day(3); await synced();
  eq(P.licence().state, 'ending', '3 days left: reminder');
  shop.active_until = day(-3); await synced();
  eq([P.licence().state, P.sellingAllowed()], ['grace', true], 'ended 3 days ago: grace, still selling');
  shop.active_until = day(-10); await synced();
  eq([P.licence().state, P.sellingAllowed()], ['expired', false], 'ended 10 days ago: selling paused');
  ok($('#banners').textContent.includes('Selling is paused'), 'paused banner');
  shop.active_until = null; await synced();
  eq([P.licence().state, P.sellingAllowed()], ['active', true], 'no end date: active');
  // Deactivated by the supplier: selling pauses at the next sync, and comes back when reactivated
  shop.deactivated = true; shop.deactivated_reason = 'Unpaid account'; await synced();
  eq([P.licence().state, P.sellingAllowed()], ['deactivated', false], 'deactivated: selling paused');
  ok($('#banners').textContent.includes('deactivated') && $('#banners').textContent.includes('Unpaid account'), 'shop sees why');
  shop.deactivated = false; shop.deactivated_reason = null; await synced();
  eq(P.sellingAllowed(), true, 'reactivated: selling again');

  // Till B: a brand-new device joins and downloads the shop
  await openDeviceB(cloud);
  await waitFor(() => P.Cloud.conf?.deviceCode === 'B' && P.state.sales.length === nSales, 4000, 'B to have the shop');
  eq(variant(product('Test <b>Tee</b>'), 'S', 'Red').stock, stock0, 'B has the same stock');
  // Devices signed in: B checks in and sees both tills online
  await w.devicePing(true);
  eq(P.Cloud.devices.map(x => x.code).sort(), ['A', 'B'], 'both tills checked in');
  ok(P.Cloud.devices.every(x => Date.now() - new Date(x.last_seen) < 60000), 'both online now');
  await nav('settings'); await tick(100);
  ok($('#cloudDevices').textContent.includes('2 devices online now') && $('#cloudDevices').textContent.includes('(this device)'), 'Settings lists the devices: ' + $('#cloudDevices').textContent.replace(/\s+/g, ' ').slice(0, 120));
  await nav('sell');

  // Both tills sell the same shirt while offline, and A changes the address
  cloud.offline = true;
  await addItem(product('Test <b>Tee</b>'), 'S', 'Red'); await pay('card');
  eq(lastSale().series, 'B', "B's receipt is in the B series");
  closeModal(); await tick();
  use(A);
  await addItem(product('Test <b>Tee</b>'), 'S', 'Red'); await pay('card');
  eq(lastSale().series, 'A', "A's receipt is in the A series");
  closeModal(); await tick();
  await nav('settings'); await tick(100);
  type('[data-setting="storeAddress"]', '1 Sync Street'); await tick(200);
  cloud.offline = false;
  await synced();
  use(document.getElementById('app2')); await synced();
  use(A); await synced();

  for (const f of [A, document.getElementById('app2')]) {
    use(f);
    const name = f === A ? 'A' : 'B';
    eq(P.state.sales.length, nSales + 2, `${name} sees both new sales`);
    eq(variant(product('Test <b>Tee</b>'), 'S', 'Red').stock, stock0 - 2, `${name}: both sales came off the stock`);
    eq(P.state.settings.storeAddress, '1 Sync Street', `${name} has the new address`);
  }
  eq(P.computeShift(P.state.meta.lastCashupAt, new Date().toISOString()).salesCount, 1, "B's cash-up counts only B's own sale");

  // Wipe device B completely, then sign in again: everything comes back
  await openDeviceB(cloud);
  await waitFor(() => P.state.sales.length === nSales + 2, 4000, 'B restored from the cloud');
  eq(variant(product('Test <b>Tee</b>'), 'S', 'Red').stock, stock0 - 2, 'restored stock is right');
  eq(P.Cloud.conf.deviceCode, 'C', 'a re-joined device gets a new till letter');

  // "Start fresh" on till A empties the shop on every device
  use(A);
  await nav('settings'); await tick(150);
  click('[data-action="start-fresh"]'); await confirmYes();
  await waitFor(() => !P.Cloud.busy && P.Cloud.pending === 0 && P.state.sales.length === 0, 6000, 'A to reset the cloud');
  use(document.getElementById('app2')); await synced();
  eq([P.state.sales.length, P.state.products.length], [0, 0], 'B was emptied too');

  // "Load demo data" on a synced shop fills every device, keeping the shop's own name
  use(A);
  await nav('settings'); await tick(150);
  type('[data-setting="storeName"]', 'Rumaanah - Demo'); await tick(200);
  const shopName = P.state.settings.storeName;
  await nav('settings'); await tick(150);
  click('[data-action="load-demo"]'); await confirmYes();
  await waitFor(() => !P.Cloud.busy && P.Cloud.pending === 0 && P.state.products.length === 8, 6000, 'A to load and upload demo data');
  eq(P.state.settings.storeName, shopName, 'shop name kept');
  use(document.getElementById('app2')); await synced();
  eq([P.state.products.length, P.state.sales.length > 0, P.state.settings.storeName], [8, true, shopName], 'B got the demo data');
  eq([P.state.customers.length, P.state.laybys.length], [3, 2], 'B got the demo clients and lay-bys too');
  const v8 = P.state.products[0].variants[0];
  eq(v8.stock, (await P.DB.getAll('movements')).filter(m => m.variantId === v8.id).reduce((a, m) => a + m.change, 0), 'demo stock matches its movements');

  // Leave the other tests offline-only
  await blank(document.getElementById('app2'));
  await deleteDbNamed('rails-pos-test-b');
  use(A);
  click('[data-action="cloud-disconnect"]'); await confirmYes();
  ok(!P.Cloud.conf.shopId && P.Cloud.conf.deviceCode === 'A', 'disconnected, till letter kept');
  P.CLOUD.url = ''; w.__cloudFetch = null;
});

test('Upgrade: data saved by version 1 is migrated', async () => {
  await blank(document.getElementById('app'));
  await deleteDb();
  await new Promise((resolve, reject) => {
    const r = indexedDB.open(TEST_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => {
      const tx = r.result.transaction('kv', 'readwrite'); const kv = tx.objectStore('kv');
      const v = { id: 'v1', size: 'M', colour: 'Red', sku: 'OLD-RED-M', stock: 3 };
      kv.put({ ...{ storeName: 'Old Shop', vatRate: 15 } }, 'settings');
      kv.put({ nextReceiptNo: 2, demo: false }, 'meta');
      kv.put([{ id: 'p1', name: 'Old Tee', category: 'Tops', price: 10000, cost: 4000, variants: [v] }], 'products');
      kv.put([{ id: 's1', number: 1, date: new Date().toISOString(), items: [{ productId: 'p1', variantId: 'v1', name: 'Old Tee', size: 'M', colour: 'Red', sku: 'OLD-RED-M', qty: 1, unitPrice: 10000, unitCost: 4000 }],
        subtotal: 10000, discountType: 'R', discountValue: 0, discount: 0, total: 10000, vatRate: 15, vat: 1304, payment: 'cash', tendered: 10000, change: 0, status: 'returned', returnedAt: new Date().toISOString() }], 'sales');
      tx.oncomplete = () => { r.result.close(); resolve(); }; tx.onerror = () => reject(tx.error);
    };
    r.onerror = () => reject(r.error);
  });
  await loadApp();
  eq([P.state.products.length, P.state.sales.length, P.state.sales[0].status, P.state.sales[0].returns.length, P.state.settings.storeName], [1, 1, 'returned', 1, 'Old Shop'], 'migrated');
  eq((await P.DB.getAll('products')).length, 1, 'products in their own store');
  eq(await P.DB.get('kv', 'products'), undefined, 'old array removed');
});

/* ---------- runner ---------- */
async function runAll() {
  const out = document.getElementById('results');
  const summary = document.getElementById('summary');
  out.innerHTML = ''; summary.textContent = 'Running…';
  await blank(document.getElementById('app2'));
  await blank(document.getElementById('app'));
  await deleteDb();
  sessionStorage.removeItem(TEST_DB + '-signed-in'); // start signed out
  await loadApp();
  let pass = 0;
  const failures = [];
  for (const t of tests) {
    const li = document.createElement('li');
    try { await t.fn(); li.className = 'pass'; li.textContent = '✓ ' + t.name; pass++; }
    catch (err) { li.className = 'fail'; li.innerHTML = '✗ '; li.append(t.name); const pre = document.createElement('pre'); pre.textContent = err.message; li.append(pre); failures.push(t.name + ': ' + err.message); }
    out.append(li);
  }
  summary.textContent = `${pass}/${tests.length} passed`;
  summary.className = pass === tests.length ? 'pass' : 'fail';
  document.title = `${pass === tests.length ? 'PASS' : 'FAIL'} ${pass}/${tests.length} · Rails POS tests`;
  window.__results = { pass, total: tests.length, failures };
  return window.__results;
}
document.getElementById('run').addEventListener('click', runAll);
if (new URLSearchParams(location.search).has('auto')) runAll();
